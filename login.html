<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Locket</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>

  <body>
    <div id="menu-mobile"></div>

    <header class="header">
      <img src="../assets/images/icons/menu.png" alt="Menu" class="menu-icon" />
      <h1 class="title">Madison Beer</h1>

      <nav class="menu-desktop">
        <a href="../locket.html">Home</a>
        <a href="../songs.html">Músicas</a>
        <a href="#" id="perfil-link">Perfil</a>
        <a href="../favorites.html">Favoritos</a>
        <a href="../terms.html" target="_blank">Termos de Uso</a>
      </nav>
    </header>

    <div class="main-content">
      <section class="login-card">
        <h2 class="login-title">Login</h2>

        <form id="login-field">
          <div class="login-field">
            <label>Email</label>
            <input type="email" id="email" required />
          </div>

          <div class="login-field">
            <label>Senha</label>
            <input type="password" id="senha" required />
          </div>

          <button type="submit" class="login-btn">Entrar</button>
        </form>

        <p class="login-register">
          Ainda não tem uma conta?
          <a href="../account.html">Criar conta</a>
        </p>
      </section>
    </div>

    <script src="../assets/js/script.js"></script>
  </body>
</html>
