<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar perfil</title>

    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>

  <body>
    <!-- MENU MOBILE -->
    <div id="menu-mobile"></div>

    <!-- HEADER -->
    <header class="header">
      <img
        src="../assets/images/icons/menu.png"
        alt="Menu"
        class="menu-icon"
      />
      <h1 class="title">Madison Beer</h1>
    </header>

    <!-- CARD EDITAR PERFIL -->
    <section class="login-card">
      <h2 class="login-title">Editar perfil</h2>

      <!-- FOTO DE PERFIL -->
      <div class="profile-photo">
        <label for="foto" class="profile-label">
          <img
            src="../assets/images/icons/profile.png"
            id="preview-foto"
            class="profile-preview"
          />
          <span class="profile-text">Alterar foto de perfil</span>
        </label>

        <input type="file" id="foto" accept="image/*" hidden />
      </div>

      <!-- FORM -->
      <form id="profile-form">
        <div class="login-field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" />
        </div>

        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" />
        </div>

        <div class="login-field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" />
        </div>

        <button type="submit" class="login-btn">
          Salvar
        </button>
      </form>
    </section>

    <!-- JS -->
    <script src="../assets/js/script.js"></script>
  </body>
</html>
