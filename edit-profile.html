<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar perfil</title>

    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>

  <body>
    <!-- MENU MOBILE -->
    <div id="menu-mobile"></div>

    <!-- HEADER -->
    <header class="header">
      <img
        src="../assets/images/icons/menu.png"
        alt="Menu"
        class="menu-icon"
      />

      <h1 class="title">Madison Beer</h1>

      <!-- MENU DESKTOP (VOLTOU!!!) -->
      <nav class="menu-desktop">
        <a href="../index.html">Home</a>
        <a href="../songs.html">Músicas</a>
        <a href="../account.html">Conta</a>
        <a href="../favorites.html">Favoritos</a>
        <a href="../terms.html" target="_blank">Termos de Uso</a>
      </nav>
    </header>

    <!-- CARD EDITAR PERFIL -->
    <section class="login-card">
      <h2 class="login-title">Editar perfil</h2>

      <!-- FOTO DE PERFIL -->
      <div class="profile-photo">
        <label for="foto" class="profile-label">
          <img
            src="../assets/images/icons/profile.png"
            id="preview-foto"
            class="profile-preview"
            alt="Foto de perfil"
          />
          <span class="profile-text">Alterar foto de perfil</span>
        </label>

        <input type="file" id="foto" accept="image/*" hidden />
      </div>

      <!-- FORM -->
      <form id="profile-form" autocomplete="on">
        <div class="login-field">
          <label for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            placeholder="Seu nome"
            required
          />
        </div>

        <div class="login-field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="seuemail@email.com"
            required
          />
        </div>

        <div class="login-field">
          <label for="senha">Nova senha</label>
          <input
            type="password"
            id="senha"
            placeholder="••••••••"
          />
        </div>

        <button type="submit" class="login-btn">
          Salvar
        </button>
      </form>

    <!-- JS -->
    <script src="../assets/js/script.js"></script>
  </body>
</html>
